<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짝 맞추기 게임</title>
    <link rel="stylesheet" href="./css/stylel.css">
</head>

<body>
    <div class="game">
        <h1>🃏 짝 맞추기 게임</h1>

        <ul class="status">
            <li>
                시도 <strong class="tries">0</strong>번
            </li>
            <li>
                시간 <strong class="time">0</strong>초
            </li>
            <li>
                최고기록 <strong class="best">없음</strong>
            </li>
        </ul>

        <div class="board"></div>

        <p class="message">카드를 눌러 시작하세요</p>

        <button class="restart">다시하기</button>
    </div>

    <script src="./js/app.js"></script>
</body>

</html>
